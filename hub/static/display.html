<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-Powered Visitor Count</title>
<style>
  /* Public big-screen display for the entry monitor: title, total visitors (split-flap), credit line. Nothing else.
     Look carried over from the 2025 expo screen: neon cyan + orange on near-black, Orbitron, scan line.
     Single dark theme on purpose. */
  @font-face { font-family: "Orbitron"; src: url("/static/fonts/orbitron.woff2") format("woff2");
               font-weight: 400 900; font-display: swap; }
  :root {
    color-scheme: dark;
    --bg-1: #1a1a1a; --bg-2: #0a0a0a;
    --cyan: #00ffff; --cyan-dim: rgba(0, 255, 255, 0.55); --cyan-faint: rgba(0, 255, 255, 0.12);
    --orange: #ff6b35; --ink: #e8fbfb;
    --font: "Orbitron", "Eurostile", "Segoe UI", system-ui, sans-serif;
    --fh: min(38vh, 19vw); --fw: calc(var(--fh) * 0.66); --gap: calc(var(--fh) * 0.07);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%); color: var(--ink);
         font-family: var(--font); overflow: hidden; position: relative; }
  body.idle { cursor: none; }
  body::before { content: ""; position: fixed; inset: 18px; border: 3px solid #333; border-radius: 16px; pointer-events: none;
                 box-shadow: inset 0 0 50px rgba(0,0,0,.8), 0 0 30px rgba(0,255,255,.10); z-index: 1; }
  body::after { content: ""; position: fixed; inset: 22px; pointer-events: none; z-index: 0;
                background: radial-gradient(circle at 50% 50%, rgba(0,255,255,.07) 0%, transparent 65%); }
  .scan { position: fixed; left: 0; right: 0; top: 0; height: 2px; z-index: 1; pointer-events: none;
          background: linear-gradient(90deg, transparent, var(--cyan), transparent); animation: scan 4s linear infinite; opacity: .7; }
  @keyframes scan { from { top: 0 } to { top: 100% } }

  .screen { position: relative; z-index: 2; height: 100%; display: grid; grid-template-rows: auto 1fr auto;
            padding: max(28px, 6vh) max(28px, 4vw) max(24px, 4.5vh); gap: max(8px, 2vh); }
  header { text-align: center; }
  h1 { margin: 0; font-weight: 900; font-size: max(22px, min(4.6vw, 8vh)); letter-spacing: .05em; color: var(--cyan);
       text-shadow: 0 0 10px var(--cyan), 0 0 22px var(--cyan), 0 0 34px var(--cyan); }
  h1 .ai { color: var(--orange); text-shadow: 0 0 10px var(--orange), 0 0 22px var(--orange), 0 0 34px var(--orange); }

  /* hero: split-flap total */
  .hero { display: grid; justify-items: center; align-content: center; gap: max(10px, 2.6vh); }
  .label { font-size: max(14px, min(2.2vw, 4vh)); font-weight: 700; letter-spacing: .28em; color: var(--cyan-dim); }
  .flaps { display: flex; gap: var(--gap); }
  .flaps .sep { width: calc(var(--gap) * 1.6); }
  .flap { position: relative; width: var(--fw); height: var(--fh); perspective: calc(var(--fh) * 4);
          border: 2px solid var(--cyan); border-radius: 12px; background: #0d0d0d;
          box-shadow: 0 10px 28px rgba(0,0,0,.85), inset 0 0 22px var(--cyan-faint); }
  .flap::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 3px; transform: translateY(-1.5px);
                 background: var(--cyan); box-shadow: 0 0 10px var(--cyan); z-index: 4; }
  .half, .leaf { position: absolute; left: 0; right: 0; height: 50%; overflow: hidden; backface-visibility: hidden; }
  .top { top: 0; border-radius: 10px 10px 0 0; transform-origin: 50% 100%; background: linear-gradient(160deg, #0a0a0a, #1a1a1a); }
  .bottom { bottom: 0; border-radius: 0 0 10px 10px; transform-origin: 50% 0; background: linear-gradient(160deg, #1a1a1a, #0d0d0d); }
  .half span, .leaf span { position: absolute; left: 0; right: 0; height: 200%; display: flex; align-items: center; justify-content: center;
                           font-weight: 900; font-size: calc(var(--fh) * .74); line-height: 1; color: var(--cyan);
                           text-shadow: 0 0 10px var(--cyan), 0 0 22px var(--cyan); font-variant-numeric: tabular-nums; }
  .top span { top: 0; }
  .bottom span { bottom: 0; }
  .leaf { visibility: hidden; z-index: 3; }
  .flap.flipping .leaf { visibility: visible; }
  .flap.flipping .leaf.top { animation: fold-top .3s ease-in forwards; }
  .flap.flipping .leaf.bottom { transform: rotateX(90deg); animation: fold-bottom .3s ease-out .3s forwards; }
  @keyframes fold-top { from { transform: rotateX(0) } to { transform: rotateX(-90deg) } }
  @keyframes fold-bottom { from { transform: rotateX(90deg) } to { transform: rotateX(0) } }
  .flap.lead span { color: rgba(0,255,255,.28); text-shadow: none; }

  footer { text-align: center; color: #888; font-weight: 700; font-size: max(12px, min(1.7vw, 3vh)); letter-spacing: .04em; }
  footer .coe { color: var(--orange); font-weight: 900; text-shadow: 0 0 10px var(--orange); }
  footer .org { color: var(--cyan); text-shadow: 0 0 5px var(--cyan); }

  @media (max-width: 900px) { :root { --fh: min(26vh, 22vw); } }  /* phones and small windows */
  @media (prefers-reduced-motion: reduce) {
    .scan { display: none; }
    .flap.flipping .leaf { animation: none; visibility: hidden; }
  }
</style>
</head>
<body>
<div class="scan" aria-hidden="true"></div>

<div class="screen">
  <header><h1><span class="ai">AI-Powered</span> Visitor Count</h1></header>

  <section class="hero" aria-live="polite">
    <div class="label">Total Visitors</div>
    <div class="flaps" id="flaps" role="img" aria-label="Total Visitors"></div>
  </section>

  <footer>Developed by <span class="coe">Center of Excellence</span>, <span class="org">ABC Technologies</span>.</footer>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DIGITS = 6;
// A change within RAPID_MS of the previous one counts as a rapid update (held, like a bulk entry).
// The hold itself comes from the hub: display_hold_s in hub/config.yaml (10 s default, e.g. 5).
const RAPID_MS = 3000, DEFAULT_HOLD_S = 10;

// ---------------------------------------------------------------- split-flap total
const flaps = [];
(function buildFlaps() {
  const box = $("flaps");
  for (let i = 0; i < DIGITS; i++) {
    if (i === DIGITS - 3) { const sep = document.createElement("div"); sep.className = "sep"; box.appendChild(sep); }
    const el = document.createElement("div");
    el.className = "flap lead";
    el.innerHTML = ["half top", "half bottom", "leaf top", "leaf bottom"].map((c) => `<div class="${c}"><span>0</span></div>`).join("");
    box.appendChild(el);
    flaps.push({ el, shown: "0", target: "0", busy: false });
  }
})();
function face(f, part, d) { f.el.querySelector(`.${part.replace(" ", ".")} span`).textContent = d; }
function run(f, delay) {
  if (f.busy || f.shown === f.target) return;
  f.busy = true;
  setTimeout(() => {
    const from = f.shown, to = f.target;
    face(f, "half top", to); face(f, "half bottom", from); face(f, "leaf top", from); face(f, "leaf bottom", to);
    f.el.classList.remove("flipping"); void f.el.offsetWidth; f.el.classList.add("flipping");
    setTimeout(() => {
      face(f, "half bottom", to); f.el.classList.remove("flipping");
      f.shown = to; f.busy = false; run(f, 0);   // a newer target may have arrived meanwhile
    }, REDUCED ? 0 : 620);
  }, REDUCED ? 0 : delay);
}
function showTotal(n) {
  const s = String(Math.min(Math.max(n, 0), 10 ** DIGITS - 1)).padStart(DIGITS, "0");
  const firstSig = s.search(/[1-9]/);
  let k = 0;
  s.split("").forEach((d, i) => {
    const f = flaps[i];
    f.el.classList.toggle("lead", firstSig === -1 ? i < DIGITS - 1 : i < firstSig);
    if (d !== f.target) { f.target = d; run(f, (k++) * 90); }
  });
  $("flaps").setAttribute("aria-label", `Total Visitors: ${n}`);
}

// ---------------------------------------------------------------- when to flip (display only; counting is never delayed)
// One new visitor flips at once. A bulk entry (a school group, several people in one update) or a rapid
// series of updates holds the shown number for the hold time, then flips straight to the latest total.
let shown = null, latest = null, changedAt = 0, holdTimer = null;
function update(total, holdS) {
  if (total === latest) return;                       // heartbeat or reconnect: nothing new
  const now = Date.now(), rapid = now - changedAt < RAPID_MS;
  latest = total; changedAt = now;
  if (shown === null) { shown = total; showTotal(total); return; }   // first load: show the total at once
  if (holdTimer) return;                              // already holding: the timer shows the newest total
  if (total === shown + 1 && !rapid) { shown = total; showTotal(total); return; }
  holdTimer = setTimeout(() => { holdTimer = null; shown = latest; showTotal(latest); }, holdS * 1000);
}

// ---------------------------------------------------------------- data: SSE (pushes on every change, auto-reconnects)
function connect() {
  const es = new EventSource("/api/v1/stream");
  es.onmessage = (e) => {
    const s = JSON.parse(e.data);
    update(s.total, Number.isFinite(s.display_hold_s) ? s.display_hold_s : DEFAULT_HOLD_S);
  };
}

// ---------------------------------------------------------------- idle cursor, keep screen awake
let idleTimer;
addEventListener("mousemove", () => { document.body.classList.remove("idle"); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000); });
async function stayAwake() { try { await navigator.wakeLock?.request("screen"); } catch (e) { /* needs localhost or https */ } }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") stayAwake(); });
stayAwake();
connect();
</script>
</body>
</html>
